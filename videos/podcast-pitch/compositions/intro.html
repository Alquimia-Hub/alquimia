<template>
  <style>
    @font-face { font-family: "Cormorant"; src: url("assets/fonts/CormorantGaramond-VF.ttf"); font-weight: 300 700; }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
    #intro-plate { position: absolute; left: 0; top: -60px; width: 1920px; height: 1280px; }
    #intro-plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #intro-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 8, 6, 0.92) 0, rgba(10, 8, 6, 0.75) 40%, rgba(10, 8, 6, 0.1) 75%); }
    #intro-l1 { position: absolute; left: 150px; top: 330px; width: 1100px; font-family: "Cormorant", serif; font-weight: 700; font-size: 132px; line-height: 1; letter-spacing: -0.015em; color: var(--ink); }
    #intro-l1 .hl { color: var(--gold2); }
    #intro-title { position: absolute; left: 150px; top: 360px; font-family: "Cormorant", serif; font-weight: 700; font-size: 176px; line-height: 0.95; letter-spacing: -0.02em; color: var(--ink); }
    #intro-title .hl { color: var(--gold2); }
    #intro-sub { position: absolute; left: 156px; top: 730px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 38px; letter-spacing: 0.08em; color: var(--gold2); }
    .intro-w { display: inline-block; }
    #intro-flood { position: absolute; inset: 0; opacity: 0; background: #d99a3d; }
  </style>
  <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
    <div id="intro-plate"><img src="assets/images/alchemist.jpg" alt="El alquimista de la marca, de noche" /></div>
    <div id="intro-shade"></div>
    <div id="intro-l1">Vamos a lanzar un <span class="hl">podcast</span> en video</div>
    <div id="intro-title">Noches de<br /><span class="hl">Alquimia</span></div>
    <div id="intro-sub">EL PODCAST DE ALQUIMIA</div>
    <div id="intro-flood"></div>
  </div>
  <script>
    (() => {
      const split = (sel, cls) => {
        const el = document.querySelector(sel);
        const nodes = [...el.childNodes];
        el.textContent = "";
        for (const node of nodes) {
          for (const word of node.textContent.split(" ").filter(Boolean)) {
            const span = document.createElement("span");
            span.className = node.nodeType === 1 ? `${cls} hl` : cls;
            span.textContent = word;
            el.appendChild(span);
            el.appendChild(document.createTextNode(" "));
          }
        }
        return [...el.children];
      };
      const l1 = split("#intro-l1", "intro-w");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#intro-plate", { scale: 1.02, transformOrigin: "987px 650px" }, { scale: 1.14, duration: 3.4, ease: "power1.in" }, 0);
      tl.fromTo(l1, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.05, ease: "power2.out" }, 0.05);
      tl.to(l1, { opacity: 0, filter: "blur(10px)", duration: 0.15, stagger: 0.02, ease: "power2.in" }, 2.3);
      // En el compás: el nombre del programa.
      tl.fromTo("#intro-title", { opacity: 0, scale: 1.08, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, 2.45);
      tl.fromTo("#intro-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 2.55);
      // Zoom al frasco y entra el siguiente mundo.
      tl.to("#intro-plate", { scale: 5, duration: 0.5, ease: "power3.in" }, 3.5);
      tl.to(["#intro-title", "#intro-sub", "#intro-shade"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.5);
      tl.fromTo("#intro-flood", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.in" }, 3.72);
      window.__timelines["intro"] = tl;
    })();
  </script>
</template>
