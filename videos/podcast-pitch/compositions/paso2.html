  </style>
  <div id="root" data-composition-id="paso2" data-width="1920" data-height="1080">

  <script>
    (() => {
      const split = (sel) => {
        const el = document.querySelector(sel);
        const nodes = [...el.childNodes];
        el.textContent = "";
        for (const node of nodes) {
          for (const word of node.textContent.split(" ").filter(Boolean)) {
            const span = document.createElement("span");
            span.className = node.nodeType === 1 ? "paso2-w hl" : "paso2-w";
            span.textContent = word;
            el.appendChild(span);
            el.appendChild(document.createTextNode(" "));
          }
        }
        return [...el.children];
      };
      const l1 = split("#paso2-l1");
      const l2 = split("#paso2-l2");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#paso2-cam", { scale: 1.04 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo("#paso2-step", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.05);
      tl.fromTo(l1, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.05, ease: "power2.out" }, 0.1);
      tl.fromTo("#paso2-card", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.25);
      // Los cohosts tildan, en corcheas.
      ["#paso2-c1", "#paso2-c2", "#paso2-c3"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out" }, 0.75 + i * 0.25);
      });
      // Y el guion se escribe.
      tl.fromTo(l2, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.05, ease: "power2.out" }, 1.5);
      tl.fromTo(".paso2-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.35, stagger: 0.12, ease: "power2.out" }, 1.6);
      tl.fromTo("#paso2-claude", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 2.0);
      window.__timelines["paso2"] = tl;
    })();
  </script>
