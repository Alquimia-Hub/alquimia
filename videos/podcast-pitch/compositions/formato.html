      tl.fromTo("#formato-step", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.05);

      const segs = [["#formato-s1", null], ["#formato-s2", "#formato-t2"], ["#formato-s3", "#formato-t3"], ["#formato-s4", "#formato-t4"], ["#formato-s5", "#formato-t5"], ["#formato-s6", null]];

        if (lab) {
          tl.fromTo(lab, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, at + 0.1);

      });
