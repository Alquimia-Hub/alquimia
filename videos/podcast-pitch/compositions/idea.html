<template>
  <style>
    @font-face { font-family: "Cormorant"; src: url("assets/fonts/CormorantGaramond-VF.ttf"); font-weight: 300 700; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #d99a3d; }
    #idea-cam { position: absolute; inset: 0; }
    #idea-eyebrow { position: absolute; left: 160px; top: 190px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 38px; letter-spacing: 0.1em; color: #0a0806; }
    .idea-line { position: absolute; left: 160px; width: 1620px; font-family: "Cormorant", serif; font-weight: 700; font-size: 132px; line-height: 0.98; letter-spacing: -0.02em; color: #0a0806; }
    #idea-rule { position: absolute; left: 160px; top: 612px; width: 1600px; height: 6px; background: #0a0806; }
    .idea-w { display: inline-block; }
  </style>
  <div id="root" data-composition-id="idea" data-width="1920" data-height="1080">
    <div id="idea-cam">
      <div id="idea-eyebrow">CÓMO LO PRODUCIMOS</div>
      <div id="idea-l1" class="idea-line" style="top: 270px">Los cohosts eligen los temas, graban y aprueban.</div>
      <div id="idea-rule"></div>
      <div id="idea-l2" class="idea-line" style="top: 660px">Todo lo demás es automático.</div>
    </div>
  </div>
  <script>
    (() => {
      const split = (sel) => {
        const el = document.querySelector(sel);
        const words = el.textContent.split(" ");
        el.textContent = "";
        for (const word of words) {
          const span = document.createElement("span");
          span.className = "idea-w";
          span.textContent = word;
          el.appendChild(span);
          el.appendChild(document.createTextNode(" "));
        }
        return [...el.children];
      };
      const l1 = split("#idea-l1");
      const l2 = split("#idea-l2");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#idea-cam", { scale: 1.05 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo("#idea-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.05);
      tl.fromTo(l1, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.06, ease: "power2.out" }, 0.1);
      tl.fromTo("#idea-rule", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 1.9);
      tl.fromTo(l2, { opacity: 0, scale: 1.15, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.05, ease: "expo.out" }, 2.0);
      window.__timelines["idea"] = tl;
    })();
  </script>
</template>
