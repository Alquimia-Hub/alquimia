<template>

  <div id="root" data-composition-id="donde" data-width="1920" data-height="1080">

  <script>
    (() => {
      const el = document.querySelector("#donde-title");
      const words = el.textContent.split(" ");
      el.textContent = "";
      for (const word of words) {
        const span = document.createElement("span");
        span.className = "donde-w";
        span.textContent = word;
        el.appendChild(span);
        el.appendChild(document.createTextNode(" "));
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#donde-cam", { scale: 1.04 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo("#donde-eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.05);
      tl.fromTo([...el.children], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, stagger: 0.05, ease: "power2.out" }, 0.1);
      // Cada plataforma cae en un pulso.
      ["#donde-yt", "#donde-sp", "#donde-x"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 0.75 + i * 0.25);
      });
      tl.fromTo(".donde-logo", { backgroundColor: "#ead9b8" }, { backgroundColor: "#f0b956", duration: 0.3, stagger: 0.25, ease: "power2.out" }, 1.0);
      tl.fromTo("#donde-web", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.9);
      window.__timelines["donde"] = tl;
    })();
