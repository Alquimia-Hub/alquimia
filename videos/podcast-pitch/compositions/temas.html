<template>
  <style>
    @font-face { font-family: "Cormorant"; src: url("assets/fonts/CormorantGaramond-VF.ttf"); font-weight: 300 700; }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
    #temas-glow { position: absolute; inset: 0; background: radial-gradient(circle at 35% 55%, rgba(184, 106, 42, 0.26) 0, rgba(184, 106, 42, 0.06) 36%, rgba(10, 8, 6, 0) 66%); }
    #temas-cam { position: absolute; inset: 0; }
    #temas-eyebrow { position: absolute; left: 160px; top: 230px; font-family: "Cormorant", serif; font-weight: 600; font-size: 96px; color: var(--ink); }
    #temas-slot { position: absolute; left: 150px; top: 380px; width: 1700px; height: 300px; }
    .temas-word { position: absolute; left: 0; top: 0; font-family: "Cormorant", serif; font-weight: 700; font-size: 250px; line-height: 1; letter-spacing: -0.03em; color: var(--gold2); white-space: nowrap; opacity: 0; }
    #temas-foot { position: absolute; left: 160px; top: 800px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 36px; letter-spacing: 0.08em; color: var(--ink3); }
  </style>
  <div id="root" data-composition-id="temas" data-width="1920" data-height="1080">
    <div id="temas-glow"></div>
    <div id="temas-cam">
      <div id="temas-eyebrow">De qué hablamos</div>
      <div id="temas-slot" data-layout-allow-overlap>
        <div id="temas-w1" class="temas-word">IA</div>
        <div id="temas-w2" class="temas-word">automatización</div>
        <div id="temas-w3" class="temas-word">biotech</div>
        <div id="temas-w4" class="temas-word">diseño</div>
        <div id="temas-w5" class="temas-word">seguridad</div>
        <div id="temas-w6" class="temas-word">startups</div>
      </div>
      <div id="temas-foot">LO QUE PASÓ EN LA SEMANA, EXPLICADO PARA TODOS</div>
    </div>
  </div>
  <script>
    (() => {
      const words = ["#temas-w1", "#temas-w2", "#temas-w3", "#temas-w4", "#temas-w5", "#temas-w6"];
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#temas-cam", { scale: 1.04 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo("#temas-eyebrow", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 0.05);
      // Un tema por pulso, como una ruleta.
      words.forEach((sel, i) => {
        const at = 0.4 + i * 0.5;
        tl.fromTo(sel, { opacity: 0, y: 70, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, at);
        if (i < words.length - 1) {
          tl.to(sel, { opacity: 0, y: -70, filter: "blur(10px)", duration: 0.14, ease: "power2.in" }, at + 0.38);
        }
      });
      tl.fromTo("#temas-foot", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.0);
      window.__timelines["temas"] = tl;
    })();
  </script>
</template>
