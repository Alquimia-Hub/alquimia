  <script>

        el.appendChild(span);
        el.appendChild(document.createTextNode(" "));

      const sources = ["#paso1-hn", "#paso1-gh", "#paso1-arxiv", "#paso1-substack", "#paso1-x", "#paso1-discord"];

      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#paso1-step", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.05);

      // Una fuente por corchea.
      sources.forEach((sel, i) => {
